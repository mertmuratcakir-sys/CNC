services:
  - type: web
    name: cnc-simulator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python warmup.py
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
